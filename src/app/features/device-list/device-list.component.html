<mat-card class="device-card">
  <mat-toolbar color="primary">Audio Devices</mat-toolbar>
  <mat-card-content>
    <table mat-table [dataSource]="devices" class="full-width-table">
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Device</th>
        <td mat-cell *matCellDef="let device">
          <strong>{{device.name}}</strong>
          <div class="device-id">{{device.pnpId}}</div>
        </td>
      </ng-container>

      <!-- Type Column -->
      <ng-container matColumnDef="flowType">
        <th mat-header-cell *matHeaderCellDef>Type</th>
        <td mat-cell *matCellDef="let device">
          <mat-chip>{{device.flowType}}</mat-chip>
        </td>
      </ng-container>

      <!-- Volume Columns -->
      <ng-container matColumnDef="volumes">
        <th mat-header-cell *matHeaderCellDef>Volumes</th>
        <td mat-cell *matCellDef="let device">
          <div class="volume-bar">
            <span>Output: {{device.renderVolume}}%</span>
            <mat-progress-bar mode="determinate" [value]="device.renderVolume"></mat-progress-bar>
          </div>
            @if (device.captureVolume > 0) {
              <div class="volume-bar">
                <span>Input: {{device.captureVolume}}%</span>
                <mat-progress-bar mode="determinate" [value]="device.captureVolume"></mat-progress-bar>
              </div>
            }
        </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let device">
          <mat-chip [color]="device.deviceMessageType === 'Confirmed' ? 'primary' : 'accent'">
            {{device.deviceMessageType}}
          </mat-chip>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>

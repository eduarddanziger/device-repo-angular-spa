<mat-card class="device-card">
  <mat-toolbar color="primary">Audio Devices</mat-toolbar>
  <mat-card-content>
    <table mat-table [dataSource]="devices" class="full-width-table">
      <!-- Name Column -->
      <ng-container matColumnDef="name">
        <td mat-cell *matCellDef="let device" style="width: 70%;">
          <strong>{{device.name}}</strong>
          <div class="device-id">{{device.pnpId}}</div>
        </td>
      </ng-container>

      <!-- Volumes Column -->
      <ng-container matColumnDef="volumes">
        <td mat-cell *matCellDef="let device" style="width: 15%;">
          <div class="volume-bar">
            <span style="display: inline-block; margin-right: 8px;">Output: {{device.renderVolume / 10}}%</span>
          </div>
          @if (device.captureVolume > 0) {
            <div class="volume-bar">
              <span style="display: inline-block; margin-right: 8px;">Input: {{device.captureVolume / 10}}%</span>
            </div>
          }
        </td>
      </ng-container>

      <!-- LastChange Column -->
      <ng-container matColumnDef="lastChange">
        <td mat-cell *matCellDef="let device" style="width: 15%;">
          {{device.LastChange | date:'yyyy-MM-dd HH:mm:ss' }}
        </td>
      </ng-container>

      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card-content>
</mat-card>
